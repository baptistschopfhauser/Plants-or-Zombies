name: Android build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: 'Upload the signed bundle to Google Play (needs PLAY_SERVICE_ACCOUNT_JSON)'
        type: boolean
        default: false
      play_track:
        description: 'Play track: internal, alpha (closed), beta (open) or production'
        type: string
        default: internal

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.BLOOMGUARD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu-latest runners ship with the Android SDK preinstalled (ANDROID_HOME).
      - name: Point Gradle at the preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install dependencies
        run: npm ci

      - name: Gameplay smoke test (bot plays every level)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm test

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOOMGUARD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build debug APK and release bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          BLOOMGUARD_KEYSTORE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          BLOOMGUARD_KEYSTORE_PASSWORD: ${{ secrets.BLOOMGUARD_KEYSTORE_PASSWORD }}
          BLOOMGUARD_KEY_ALIAS: ${{ secrets.BLOOMGUARD_KEY_ALIAS }}
          BLOOMGUARD_KEY_PASSWORD: ${{ secrets.BLOOMGUARD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Verify the release bundle is signed (Play rejects unsigned bundles)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab)
          jarsigner -verify "$AAB" | tee verify.txt
          grep -q "jar verified" verify.txt

      # Without your secrets, prove the signing pipeline anyway: sign with a throwaway key,
      # verify the signature, and let Google's bundletool validate the bundle and build APKs from it.
      - name: Signing + bundle validation self-test (throwaway key)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          KS="$RUNNER_TEMP/selftest.jks"
          keytool -genkeypair -keystore "$KS" -alias selftest -keyalg RSA -keysize 2048 -validity 1 \
            -storepass selftest -keypass selftest -dname "CN=Bloomguard self-test"
          BLOOMGUARD_KEYSTORE="$KS" BLOOMGUARD_KEYSTORE_PASSWORD=selftest BLOOMGUARD_KEY_ALIAS=selftest BLOOMGUARD_KEY_PASSWORD=selftest \
            ./gradlew --no-daemon bundleRelease
          AAB=$(ls app/build/outputs/bundle/release/*.aab)
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt"
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$AAB"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" | tee "$RUNNER_TEMP/manifest.xml"
          grep -q 'package="io.github.bloomguard.game"' "$RUNNER_TEMP/manifest.xml"
          grep -q 'android:targetSdkVersion="36"' "$RUNNER_TEMP/manifest.xml"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$AAB" --output="$RUNNER_TEMP/app.apks" --mode=universal \
            --ks="$KS" --ks-key-alias=selftest --ks-pass=pass:selftest --key-pass=pass:selftest
          echo "Signed bundle validated by bundletool: Play-ready once signed with your own upload key."
          rm -f "$AAB" # never publish a throwaway-signed bundle as the release artifact
          ./gradlew --no-daemon bundleRelease

      - name: Upload to Google Play
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_play && env.HAS_KEYSTORE == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.bloomguard.game
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.play_track }}
          status: ${{ inputs.play_track == 'production' && 'draft' || 'completed' }}

      - uses: actions/upload-artifact@v4
        with:
          name: bloomguard-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bloomguard-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
